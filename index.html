<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <!-- viewport for mobile: WebAR runs on phones, this is mandatory -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Ожившие книги — WebAR для библиотеки</title>

  <!--
    ============================================================
    Ожившие книги — WebAR-демо для библиотеки
    ============================================================
    Стек:  A-Frame 1.5.0  (декларативный 3D поверх Three.js)
           MindAR    1.2.5  (image-tracking для WebAR)
    Обе библиотеки подключаются через CDN — никакой установки.

    Как это работает:
      1. MindAR читает targets.mind (скомпилированные обложки книг).
      2. Камера ищет в кадре эти обложки.
      3. Когда обложка найдена — MindAR ставит <a-entity> с targetIndex="N"
         ровно поверх неё в 3D-пространстве.
      4. Внутри этой <a-entity> мы кладём <a-gltf-model> с 3D-моделью книги.
      5. Наша маленькая компонента auto-animate запускает анимацию модели.
    ============================================================
  -->

  <!-- A-Frame: 3D-движок. Даёт теги <a-scene>, <a-entity>, <a-gltf-model> -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- MindAR: поверхностный трекинг изображений в браузере -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
      background: #111;
      color: #fff;
    }
    #scene-wrap { position: fixed; inset: 0; }
    a-scene { width: 100% !important; height: 100% !important; }

    /* ---- UI overlay поверх 3D-сцены ---- */
    .overlay {
      position: fixed; left: 0; right: 0; z-index: 10;
      pointer-events: none; /* чтобы не перекрывать клики по сцене */
    }
    .top { top: 0; padding: 14px 16px; }
    .bottom { bottom: 0; padding: 16px; }

    .pill {
      display: inline-block;
      background: rgba(20, 28, 40, 0.78);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 14px;
      line-height: 1.3;
    }
    .pill b { color: #ffd166; }

    .hint {
      text-align: center;
      font-size: 15px;
      background: rgba(20, 28, 40, 0.78);
      border-radius: 12px;
      padding: 10px 14px;
      max-width: 520px;
      margin: 0 auto;
      border: 1px solid rgba(255,255,255,0.15);
    }

    /* ---- Экран загрузки ---- */
    #loader {
      position: fixed; inset: 0; z-index: 20;
      background: radial-gradient(circle at 50% 35%, #1b2a3a, #0a0f16);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 24px;
      transition: opacity 0.6s ease;
    }
    #loader h1 {
      font-size: clamp(22px, 6vw, 34px);
      margin: 0 0 6px;
      font-weight: 700;
    }
    #loader p { color: #9bb; margin: 0 0 24px; font-size: 14px; }
    .spinner {
      width: 38px; height: 38px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #ffd166;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader.hidden { opacity: 0; pointer-events: none; }

    /* ---- Кнопка старта камеры (мобильные браузеры требуют жест пользователя) ---- */
    #startBtn {
      pointer-events: auto;
      margin-top: 18px;
      background: #ffd166; color: #15202b;
      border: none; border-radius: 999px;
      padding: 12px 26px; font-size: 16px; font-weight: 700;
      cursor: pointer;
    }
    #startBtn:disabled { opacity: 0.5; cursor: wait; }

    .note {
      position: fixed; bottom: 12px; right: 12px; z-index: 10;
      font-size: 11px; color: rgba(255,255,255,0.5);
    }
  </style>
</head>

<body>
  <!-- ====== Экран загрузки ====== -->
  <div id="loader">
    <h1>Ожившие книги</h1>
    <p>WebAR для библиотеки · MindAR + A-Frame</p>
    <div class="spinner" id="spinner"></div>
    <button id="startBtn" disabled>Запустить камеру</button>
  </div>

  <!-- ====== UI поверх сцены ====== -->
  <div class="overlay top">
    <span class="pill" id="statusPill">Готовимся…</span>
  </div>
  <div class="overlay bottom">
    <div class="hint" id="hint">
      Наведите камеру на обложку книги «Лис и Лес», «Шаги в Будущем» или «Мой Механический Друг»
    </div>
  </div>
  <div class="note">Демо · 3 книги</div>

  <!--
    ====== A-Frame сцена ======
    mindar-image-system: активирует трекинг изображений.
      imageTargetSrc — путь к скомпилированному файлу целей (targets.mind).
      filterBetaCV   — лёгкое сглаживание дрожания модели (0 = выкл).
    renderer="alpha: true; antialias: true" — видео должно просвечивать.
  -->
  <div id="scene-wrap">
    <a-scene
      mindar-image-system="imageTargetSrc: ./assets/targets/targets.mind; filterBetaCV: 0.1;"
      color-space="sRGB"
      renderer="alpha: true; antialias: true; logarithmicDepthBuffer: true;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      embedded
      loading-screen="enabled: false">

      <!-- Камера. MindAR сам управляет её положением, никакой look-controls. -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!--
        3D-модели подключаются напрямую через src (путь к .glb).
        Мы НЕ используем <a-assets> с предзагрузкой: у неё жёсткий таймаут 3 с,
        и тяжёлая модель (brainstem.glb ≈ 3 МБ) на мобильном интернете не
        успевает скачаться — A-Frame отдаёт gltf-model пустые данные и падает
        с JSON.parse. Прямой src грузит каждую модель своей GLTFLoader-очередью,
        без таймаута: сцена стартует сразу, а модели «подключаются» по мере загрузки.
      -->

      <!--
        ===================== Книга 1: «Лис и Лес» =====================
        targetIndex="0" — это первая картинка в порядке компиляции targets.mind.
        Внутри — gltf-модель лисы. У неё три встроенные анимации (бег, прыжок, осмотр).
        rotation="-90 0 0" ставит модель «на ноги»: gltf хранит ось Y вверх,
        а плоскость обложки лежит в X-Y, наружу смотрит ось Z.
        scale="0.01" — модель лисы в исходном файле очень крупная.
        auto-animate — наша компонента (см. <script> внизу), проигрывает все клипы.
      -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model
          src="./assets/models/fox.glb"
          position="0 0 0"
          rotation="-90 0 0"
          scale="0.01 0.01 0.01"
          auto-animate>
        </a-gltf-model>
      </a-entity>

      <!-- ===================== Книга 2: «Шаги в Будущем» ===================== -->
      <a-entity mindar-image-target="targetIndex: 1">
        <a-gltf-model
          src="./assets/models/cesiumman.glb"
          position="0 0 0"
          rotation="-90 0 0"
          scale="0.4 0.4 0.4"
          auto-animate>
        </a-gltf-model>
      </a-entity>

      <!-- ===================== Книга 3: «Мой Механический Друг» ===================== -->
      <a-entity mindar-image-target="targetIndex: 2">
        <a-gltf-model
          src="./assets/models/brainstem.glb"
          position="0 0 0"
          rotation="-90 0 0"
          scale="0.5 0.5 0.5"
          auto-animate>
        </a-gltf-model>
      </a-entity>

    </a-scene>
  </div>

  <script>
    /* =====================================================================
       Компонента auto-animate
       ---------------------------------------------------------------------
       A-Frame загружает gltf-модель, но сам анимации не проигрывает.
       Эта компонента:
         1) ждёт событие model-loaded,
         2) создаёт THREE.AnimationMixer,
         3) запускает ВСЕ клипы модели одновременно (loop, повторяется).
       Если в модели только один клип — он зацикливается; если несколько
       (как у лисы: Run/Jump/Inspect) — все играют сразу, создавая живую сцену.

       Это намеренно простая компонента (~20 строк) — её легко прочитать
       и поменять под себя.
       ===================================================================== */
    AFRAME.registerComponent('auto-animate', {
      init: function () {
        this.mixer = null;

        this.el.addEventListener('model-loaded', (e) => {
          const mesh = this.el.getObject3D('mesh'); // THREE.Group gltf-сцены
          if (!mesh) return;

          // У gltf-сцены массив анимаций живёт в свойстве .animations
          const clips = mesh.animations || [];
          if (clips.length === 0) {
            console.warn('auto-animate: в модели нет анимаций', this.el.getAttribute('src'));
            return;
          }

          this.mixer = new THREE.AnimationMixer(mesh);
          clips.forEach((clip) => {
            const action = this.mixer.clipAction(clip);
            action.reset();
            action.setLoop(THREE.LoopRepeat, Infinity);
            action.clampWhenFinished = false;
            action.play();
          });
          console.log('auto-animate: запущено клипов:', clips.length, this.el.getAttribute('src'));
        });
      },

      // A-Frame вызывает tick каждый кадр; delta — миллисекунды.
      tick: function (time, delta) {
        if (this.mixer) {
          this.mixer.update((delta || 16) / 1000);
        }
      }
    });

    /* =====================================================================
       UI-логика: статус, экран загрузки, подсказки при обнаружении книги
       ===================================================================== */
    const loader    = document.getElementById('loader');
    const spinner   = document.getElementById('spinner');
    const startBtn  = document.getElementById('startBtn');
    const statusPill= document.getElementById('statusPill');
    const hint      = document.getElementById('hint');

    const BOOKS = [
      { idx: 0, title: '«Лис и Лес»',            model: 'Лиса бежит по тропе' },
      { idx: 1, title: '«Шаги в Будущем»',       model: 'Путешественник идёт вперёд' },
      { idx: 2, title: '«Мой Механический Друг»', model: 'Робот машет рукой' },
    ];

    function setStatus(text, accent) {
      statusPill.innerHTML = accent ? `<b>${accent}</b> · ${text}` : text;
    }

    // Ждём, пока A-Frame и MindAR полностью прогрузятся.
    const sceneEl = document.querySelector('a-scene');
    sceneEl.addEventListener('loaded', () => {
      setStatus('Сцена готова');
      // MindAR ставит систему на <a-scene>; дождёмся её инициализации.
      const system = sceneEl.systems['mindar-image-system'];
      const onReady = () => {
        spinner.style.display = 'none';
        startBtn.disabled = false;
        startBtn.textContent = 'Запустить камеру';
        setStatus('Нажмите «Запустить камеру»');
      };
      if (system && system.initialized) onReady();
      else sceneEl.addEventListener('arready', onReady, { once: true });
    });

    // Старт камеры по кнопке — так требуют мобильные Safari/Chrome:
    // доступ к камере должен инициироваться жестом пользователя.
    startBtn.addEventListener('click', async () => {
      startBtn.disabled = true;
      startBtn.textContent = 'Запуск…';
      try {
        await sceneEl.systems['mindar-image-system'].start();
        loader.classList.add('hidden');
        setTimeout(() => { loader.style.display = 'none'; }, 700);
        setStatus('Наведите камеру на обложку');
      } catch (err) {
        console.error(err);
        startBtn.disabled = false;
        startBtn.textContent = 'Попробовать снова';
        setStatus('Ошибка камеры. Разрешите доступ и повторите.', '!');
        hint.textContent = 'Браузер не дал доступ к камере. Проверьте разрешения сайта и что вы открыли страницу по HTTPS (или с localhost).';
      }
    });

    // Подписываемся на события каждой цели: «книга найдена» / «потеряна».
    document.querySelectorAll('[mindar-image-target]').forEach((targetEl) => {
      const idx = parseInt(targetEl.getAttribute('mindar-image-target').targetIndex, 10);
      const book = BOOKS[idx];

      targetEl.addEventListener('targetFound', () => {
        setStatus(`Книга найдена: ${book.title}`, '✓');
        hint.textContent = `${book.title} — ${book.model}`;
      });
      targetEl.addEventListener('targetLost', () => {
        setStatus('Поиск обложки…');
        hint.textContent = 'Наведите камеру на обложку одной из трёх книг';
      });
    });
  </script>
</body>
</html>
